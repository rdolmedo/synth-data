# snowball-eval on vLLM main 8f3c672dc (#478): the same recipe and checks as snowball-eval.toml, with
# - venv /data/aai/venvs/vllm-0.34.0rc1.dev815-g8f3c672dc-cu132 (FlashInfer 0.7.4 + flashinfer-cubin);
# - the 0.34 plugin serve_snowball/plugin_v034 (model; config with layer_types: 7 full + 19 sliding-window layers;
#   SWA keep for 0.34) and serve_snowball/snowball_parsers_v034.py; serve_snowball/plugin (0.20.1) is untouched;
# - no --gpu-memory-utilization: 0.34 sizes its extensible KV after warmup, and 0.90 kept 15.9 GiB out of it;
# - VLLM_CHAT_TEMPLATE_RENDER_TIMEOUT 600: 0.34's 30 s default failed some long-history renders at 4 cores (HTTP 500);
# - GRUG_SEEDED_SAMPLER dropped (the V2 runner samples seeded requests natively); GRUG_FI_AOT_DIR = FlashInfer 0.7.4
#   modules (trtllm_utils, sampling, fmha_gen, fused_moe_trtllm_sm100) built on a CPU node for 10.0a. B200 only
#   (serving_resources.cuda_capabilities); FLASHINFER_NO_DOWNLOAD as deepseek-v41-flash-1017 (same venv: the cubin
#   wheel holds every cubin, so a miss fails instead of writing into the shared venv).
# Measured (#478, 2026-11-19, same B200, server pinned to 4 cores = the #531 shape, TB2.1 Snowball replay): 5,281 vs
# 4,677 gen tok/s at 128 agents (+12.9%), 5,781 vs 4,242 at 192 (+36%, prefix hit 0.94 vs 0.83); served BPB 0.279431 vs
# 0.279455 (eval recipe, super-scaling-300m val); 2,714 TB2.1 requests rebuilt from recorded attempts get identical
# prompt token ids from a snowball-eval and a snowball-eval-main server (serve_snowball/render_check.py --compare), so
# check_train_serve's 0.20.1 result carries over; the ported parsers match 0.20.1's on recorded Snowball turns
# (test_parsers.py). Start-up through serve_teacher: 282 s after staging vs 141 s on 0.20.1 (imports from the /data venv
# before engine init; ~2 min with a node-local venv copy, as in the replays).
#
#   serve_teacher submit --teacher snowball-eval-main --checkpoint DIR --name NAME     (1x B200 at bid 61 by default)
# Everything else (the eval_q35 Snowball TB recipe, request, checkpoint checks, resources and their measurements) is
# snowball-eval's: see snowball-eval.toml's header. Comments below that came with it describe snowball-eval.
slug = "snowball-eval-main"
model = "GrugMoe 67B-A2B (Snowball architecture), TB SFT exports of sft_snowball/hf_io.py"
revision = "per checkpoint: serve_teacher --checkpoint (recorded in job.json, launch.json and endpoints.json)"
checkpoint = "/data/aai/tbenchtrain/snowball_sft/ckpts/ib-sb18k-1p0b-lr5p8e-4"
served_name = "snowball"
stage_checkpoint = true

[checkpoint_checks]
architectures = ["GrugMoeForCausalLM"]
# sft_snowball/snowball_chat_template.jinja (eval_q35 common.GRUG_TEMPLATES['snowball']): <think> and XML tool calls,
# which snowball_parsers_v034.py reads
chat_template_sha256 = ["cb728ba63d3c6393bbce328a7c6a00359f259b7b9b1bbdc074b1ad53e5029f7c"]

[runtime]
venv = "/data/aai/venvs/vllm-0.34.0rc1.dev815-g8f3c672dc-cu132"
vllm_version = "0.34.0rc1.dev815+g8f3c672dc"
cuda_home = "/is/software/nvidia/cuda-13.2"
cuda_visible_devices = "index"   # GPU indices, as snowball-eval (vLLM 0.20.1 needed them; measured this way on 0.34)
cache_env = ["HOME", "VLLM_CACHE_ROOT", "TORCHINDUCTOR_CACHE_DIR", "TRITON_CACHE_DIR", "FLASHINFER_WORKSPACE_BASE",
             "XDG_CACHE_HOME"]
env = { PATH = "/is/software/nvidia/cuda-13.2/bin:/data/aai/venvs/vllm-0.34.0rc1.dev815-g8f3c672dc-cu132/bin:/usr/local/bin:/usr/bin:/bin", PYTHONPATH = "{repo}/serve_snowball/plugin_v034", HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1", VLLM_WORKER_MULTIPROC_METHOD = "spawn", VLLM_ENGINE_READY_TIMEOUT_S = "3600", GRUG_SWA_KEEP = "1", GRUG_TRITON_ROUTING = "1", GRUG_FP8_POW2 = "1", VLLM_USE_DEEP_GEMM = "0", VLLM_CHAT_TEMPLATE_RENDER_TIMEOUT = "600", FLASHINFER_NO_DOWNLOAD = "1" }

[serving]
mode = "replicas"
gpus_per_replica = 1
entrypoint = ["{venv}/bin/vllm", "serve"]
args = [
  "{model_dir}", "--served-model-name", "{served_name}", "--host", "0.0.0.0", "--port", "{port}",
  "--max-model-len", "{max_model_len}", "--tensor-parallel-size", "1",
  "--max-num-seqs", "{max_seqs}", "--max-num-batched-tokens", "{max_batched}", "--api-server-count", "{api_servers}",
  "--enable-prefix-caching", "--kv-cache-dtype", "fp8", "--quantization", "fp8",
  "--hf-overrides", '{{"quantization_config":{{"quant_method":"fp8","activation_scheme":"dynamic","weight_block_size":[128,128]}},"architectures":["GrugMoeServeForCausalLM"]}}',
  "--reasoning-parser-plugin", "{repo}/serve_snowball/snowball_parsers_v034.py",
  "--tool-parser-plugin", "{repo}/serve_snowball/snowball_parsers_v034.py",
  "--reasoning-parser", "snowball", "--enable-auto-tool-choice", "--tool-call-parser", "snowball",
  "--generation-config", "vllm", "--override-generation-config", '{{"temperature":1.0,"top_p":0.95}}',
  "--chat-template", "{model_dir}/chat_template.jinja",
  "--language-model-only", "--enable-prompt-tokens-details",
  "--no-enable-log-requests", "--seed", "{seed}",
]
seed = 0
startup_timeout_sec = 3600
# Startup probes (synth.probe: greedy "17 + 25" and a bare-bash tool call) are logged to <registry>/probe.jsonl, not
# fatal: a student that answers the bare prompt in plain text (m5v-W-1b, 2026-11-13) is a model outcome; parsing was
# validated in the smoke (notes/serving.md).
probe = "log"

[serving.env]
GRUG_FI_AOT_DIR = "/data/aai/tbenchtrain/snowball_serve/fi_aot_074/{fi_aot_arch}"   # FlashInfer 0.7.4 modules (B200 only)

[serving.tunables]
max_seqs = 256           # eval_q35 default
max_batched = 16384      # eval_q35 serve_job.sh
api_servers = 4          # eval_q35 snowball_config
fi_aot_arch = "100a"     # B200 (no 90a modules for FlashInfer 0.7.4: H100 stays on snowball-eval)
omp_threads = 4          # = the cores per engine (cpus_per_gpu; one engine per GPU here) since the #531 trim (#547):
                         # 8 on 4 cores gave 21-29 s of run-queue wait per 10 s during init. OMP_NUM_THREADS is not
                         # numerics. Was 8 (copied before #547)

[request]
client_model = "hosted_vllm/snowball"
# pi_eval: run eval_q35's context-aware turn gate with the run, plus the proxies' KV brake 0.80/0.72
ctx_gate = true
ctx_fill = 0.7
kv_gate = "0.80,0.72"
overrides = { temperature = 1.0, top_p = 0.95, reasoning_effort = "high", chat_template_kwargs = { clear_thinking = false } }

[counting]
# synth-campaign token accounting only (synth/serializers.py, synth/prepare.py); serve_teacher never reads it, so the
# engine argv, env and engine-cache key are unchanged. The checkpoint's own Llama-3 tokenizer and Snowball template.
serializer = "jinja"
tokenizer = "{checkpoint}/tokenizer.json"
chat_template = "{checkpoint}/chat_template.jinja"
render_kwargs = { add_generation_prompt = false }

[serving_resources]
# #378 method (2026-11-14, optim-port-snowshape-1, 1x B200 at 8c/96G, replay of eval_q35's TB2.1 Snowball traffic at
# 128 agents, the dispatcher budget: 4,366 gen tok/s, prefix hit 0.94, no holds): cgroup non-reclaimable peak 8.8 GiB
# (rss 8.6 + shmem 0.2; page cache is reclaimed, never held; M5's long AA runs: condor RSS <= 10.6 GB per engine),
# serving cores p99 2.51 (load window 2.35), start-up max 3.9. CPUs bind: 3x p99 -> 8. RAM is free up to 16 x CPUs
# (units = max(CPUs, GB/16)), so 128 GiB at the same 8 units as 96 (no saving: CPUs were already at need). More page
# cache for the 125 GiB staged checkpoint, though it still does not fit whole with the 8.8 GiB peak (benefit unmeasured).
# /data/aai/aa_evals/audits/snowball_port_20261114/live/shape_summary.json. Was 8 / 96 (#258 eval_q35 numbers).
# 2026-11-18 (#531, rt-lean, coordinator-approved trim): the 11-15..18 evals' 2-GPU servers (one engine per GPU) used
# mean 2.2-2.9 cores, p95 3.4-4.2, max 9-10 only at start-up, and 17-20 GB of hard memory (36 GB on 4 GPUs), against
# 16c/256G: 4c / 64G per GPU (8c/128G per 2-GPU server, -8 units/h per server, -12.5%; ~30k credits at the floor over
# that window). Start-up may briefly want more cores than that (it is slower, not refused); the memory net (+25% per
# hold) covers RAM. Was 8 / 128. One engine per GPU on this spec (no gpu_util to split: vLLM 0.34 sizes the KV itself;
# serve_teacher refuses engines_per_gpu > 1).
cpus_per_gpu = 4
memory_gib_per_gpu = 64    # hard 17-20 GB per 2-GPU server, 36 GB per 4; mean cores 2.2-2.9, p95 3.4-4.2; was 128
cuda_capability = "10.0"   # B200
cuda_capabilities = ["10.0"]   # only: FlashInfer 0.7.4 modules exist for 10.0a only (fi_aot_074/100a)
default_gpus = 1           # one replica (submit --gpus N: N independent engines, one per GPU)
default_bid = 61
disk_gib = 400             # 134 GB bf16 checkpoint staged on local disk, plus engine caches
bypass_lxcfs = true
exclude_nodes = ["cpu102", "cpu307", "cpu403", "cpu405"]   # eval_q35 submit.py's Snowball exclusions
