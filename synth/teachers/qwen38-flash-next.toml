# Qwen3.8-Flash-Next (NVIDIA mixed NVFP4/FP8), TP4 + EP single replica, MTP-3, Engram CPU offload.
# Provenance: campaign 20261016T171932Z (generation/pi-submit-20261016T171932Z/qwen38-flash-next),
# 111.48M tokens / TB2.1 pass@1 73.41%. Profile tep4-mtp3-offload.
# Runtime: nightly vLLM 0.32.0rc1.dev255 overlaid on venvs/vllm032 (runtime-direct, campaign_dependencies.pth).
slug = "qwen38-flash-next"
model = "Qwen/Qwen3.8-Flash-Next"
revision = "fc694b54fb0174e0913e6adf86691ef85a4ead47"   # nvidia/Qwen3.8-Flash-Next-NVFP4
checkpoint = "/data/aai/tbench/pi-cont16k-110m/20261015T215325Z/ops/qwen38-flash-next/checkpoint/fc694b54fb0174e0913e6adf86691ef85a4ead47"
served_name = "qwen38-flash-next"
stage_checkpoint = true

[runtime]
venv = "/data/aai/tbench/pi-cont16k-110m/20261015T215325Z/ops/qwen38-flash-next/runtime-direct"
vllm_version = "0.32.0rc1.dev255+gf8460ef23"
cuda_home = "cu13-wheel"
cu13_fallback_venvs = ["/opt/aai/venvs/vllm032"]
cu13_ld_library_path = true
nvcc_append_flags = "-DCCCL_DISABLE_CTK_COMPATIBILITY_CHECK"
cache_env = ["VLLM_CACHE_ROOT", "TORCHINDUCTOR_CACHE_DIR", "TRITON_CACHE_DIR", "FLASHINFER_WORKSPACE_BASE", "XDG_CACHE_HOME", "HF_HOME"]
env = { PYTHONDONTWRITEBYTECODE = "1", TOKENIZERS_PARALLELISM = "false", OPENBLAS_NUM_THREADS = "1" }

[serving]
mode = "replicas"
gpus_per_replica = 4
entrypoint = ["{venv}/bin/python", "-m", "vllm.entrypoints.cli.main", "serve"]
args = [
  "{model_dir}", "--served-model-name", "{served_name}", "--host", "0.0.0.0", "--port", "{port}",
  "--tensor-parallel-size", "4", "--enable-expert-parallel", "--max-model-len", "{max_model_len}",
  "--gpu-memory-utilization", "0.9", "--max-num-seqs", "{max_seqs}", "--max-num-batched-tokens", "{max_batched}",
  "--quantization", "modelopt", "--enable-prefix-caching", "--kv-cache-dtype", "fp8",
  "--attention-config.indexer_kv_dtype", "fp8", "--engram-config", '{{"cpu_offload": true}}',
  "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder", "--reasoning-parser", "qwen3",
  "--generation-config", "vllm",
  "--override-generation-config", '{{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0,"max_new_tokens":{max_output_tokens}}}',
  "--default-chat-template-kwargs", '{{"enable_thinking":true,"preserve_thinking":true,"reasoning_effort":"xhigh"}}',
  "--limit-mm-per-prompt", '{{"image":0,"video":0}}', "--seed", "{seed}", "--no-enable-log-requests",
]
seed = 0
startup_timeout_sec = 5400

[serving.tunables]
mtp = 3
max_seqs = 256
max_batched = 16384
omp_threads = 8

[serving.optional_args]
mtp = ["--speculative-config", '{{"method":"mtp","num_speculative_tokens":{mtp}}}', "--no-enable-flashinfer-autotune"]

[request]
client_model = "hosted_vllm/qwen38-flash-next"
pi_thinking = "xhigh"
overrides = { temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, repetition_penalty = 1.0, reasoning_effort = "xhigh", chat_template_kwargs = { enable_thinking = true, preserve_thinking = true, reasoning_effort = "xhigh" } }

[counting]
serializer = "jinja"
tokenizer = "{checkpoint}/tokenizer.json"
chat_template = "{checkpoint}/chat_template.jinja"
render_kwargs = { add_generation_prompt = false, enable_thinking = true, preserve_thinking = true, reasoning_effort = "xhigh" }
tokenize_crosscheck = "native"

[serving_resources]
cpus_per_gpu = 8
memory_gib = 512
disk_gib = 500
bid_per_job = { 4 = 63 }
exclude_nodes = ["gpu103", "gpu132", "cpu207", "cpu307", "cpu404"]

[worker_resources]
slots = 32
cpus = 32
memory_gib = 352
disk_gib = 500
bid = 35
exclude_nodes = ["gpu103", "gpu132", "cpu101"]

[admission]
initial_limit_per_backend = 192
maximum_limit_per_backend = 224
emergency_kv_high = 0.85
resume_kv = 0.70
