# Tuned serving recipe (#70, 2026-11-03) of qwen38-27b-eval (same model, sampling, parsers, template, 262k context,
# images): bf16 GDN recurrent state (the checkpoint config says fp32; halves each sequence's state blocks, hybrid block
# 1,600 -> 832 tokens), gpu_memory_utilization 0.94, a CPU KV tier (SimpleCPUOffloadConnector, 160 GiB on B200, 80 on
# H100 via --tunables) with synth-cpu-supersede v2, and prompt-tokens details for the admission gate's reuse signal.
# Replays and numerics: aa_evals/qwenserve/README.md. serve_teacher puts the admission gate in front (PROFILE).
# Base spec notes:
# AA evals (#51 overnight): Qwen3.8-27B FP8 as the MODEL UNDER TEST on 1x H100 per replica: 262k context (serve_teacher profile), images up to 256 per prompt, default reasoning xhigh (= AA "Qwen3.8 27B (Xhigh)").
# Qwen3.8-27B (NVIDIA mixed NVFP4/FP8), dense hybrid Gated-DeltaNet + attention, one replica per B200, MTP-3.
# Provenance: campaign 20261016T171932Z (generation/pi-submit-20261016T171932Z/qwen38-27b) -- stopped at
# 104.88M tokens / 261 of 267 eval when /data ran out of inodes (2026-10-17 11:07Z).
# Command: ops/.../server-nvfp4-mtp3-v1-command.json (duplicated flags removed; last value kept).
slug = "qwen38-27b-eval-fast"
model = "Qwen/Qwen3.8-27B"
revision = "017b9c7af6b5689d5dd426a76e0bc077eb5ca20a"   # Qwen/Qwen3.8-27B-FP8: the build in `checkpoint` (its .cache/huggingface download records; config, tokenizer_config, generation_config and chat_template match that revision's blob ids). Until 2026-11-14 this named the NVFP4 build of qwen38-27b.toml (482ca0f).
checkpoint = "/data/aai/models/Qwen3.8-27B-FP8"
served_name = "qwen38-27b"
# Weight quantization as served (a label; the effective one, after --tunables, is recorded per job in
# numerics.<job>.json and endpoints.json "weights_quantization"). served_name qwen38-27b also names the NVFP4
# build (qwen38-27b.toml, synthesis): results tell them apart by weights_quantization / numerics_sha256.
quantization = "fp8/e4m3"   # checkpoint-native block FP8 (128x128), no --quantization
stage_checkpoint = true

[runtime]
venv = "/opt/aai/venvs/vllm032"
vllm_version = "0.32.0rc1.dev190+g3f1bcfd82"
cuda_home = "cu13-wheel"
nvcc_append_flags = "-DCCCL_DISABLE_CTK_COMPATIBILITY_CHECK"
cache_env = ["VLLM_CACHE_ROOT", "TORCHINDUCTOR_CACHE_DIR", "TRITON_CACHE_DIR", "FLASHINFER_WORKSPACE_BASE", "XDG_CACHE_HOME"]
env = { HF_HUB_OFFLINE = "1", HF_HUB_DISABLE_XET = "1", VLLM_MAX_MEDIA_REQUEST_DECODE_BYTES = "2147483648", VLLM_USE_SIMPLE_KV_OFFLOAD = "1", PYTHONPATH = "/data/aai/tbench/vllm_plugins/cpu_supersede_v2", SYNTH_CPU_SUPERSEDE = "1" }

[serving]
mode = "replicas"
gpus_per_replica = 1
entrypoint = ["{venv}/bin/vllm", "serve"]
args = [
  "{model_dir}", "--served-model-name", "{served_name}", "--host", "0.0.0.0", "--port", "{port}",
  "--max-model-len", "{max_model_len}", "--tensor-parallel-size", "1", "--gpu-memory-utilization", "0.94",
  "--max-num-seqs", "{max_seqs}", "--max-num-batched-tokens", "{max_batched}",
  "--enable-prefix-caching", "--enable-chunked-prefill", "--enable-auto-tool-choice",
  "--tool-call-parser", "qwen3_coder", "--reasoning-parser", "qwen3", "--generation-config", "vllm", "--seed", "{seed}",
  "--override-generation-config", '{{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0,"max_tokens":{max_output_tokens},"stop_token_ids":[248046,248044]}}',
  "--default-chat-template-kwargs", '{{"enable_thinking":true,"preserve_thinking":true,"reasoning_effort":"xhigh"}}',
  "--limit-mm-per-prompt", '{{"image":256,"video":0}}', "--mm-processor-kwargs", '{{"max_pixels":4194304}}',
  "--no-enable-log-requests", "--kv-cache-dtype", "fp8_e4m3", "--mamba-ssm-cache-dtype", "bfloat16",
  "--enable-prompt-tokens-details",
]
seed = 0
startup_timeout_sec = 3600

[serving.tunables]
mtp = 3
max_seqs = 128
max_batched = 16384
omp_threads = 8
kv_offloading_size = 160   # GiB of pinned host RAM; H100 jobs: --tunables '{"kv_offloading_size": 80}'

[serving.optional_args]
mtp = ["--speculative-config", '{{"method":"mtp","num_speculative_tokens":{mtp}}}']
kv_offloading_size = ["--kv-offloading-size", "{kv_offloading_size}", "--kv-offloading-backend", "native",
                      "--kv-transfer-config", '{{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{{"lazy_offload":false}}}}']

[request]
client_model = "hosted_vllm/qwen38-27b"
pi_thinking = "xhigh"
overrides = { temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, repetition_penalty = 1.0, reasoning_effort = "xhigh", chat_template_kwargs = { enable_thinking = true, preserve_thinking = true, reasoning_effort = "xhigh" } }

[counting]
serializer = "jinja"
tokenizer = "{checkpoint}/tokenizer.json"
chat_template = "{checkpoint}/chat_template.jinja"
render_kwargs = { add_generation_prompt = false, enable_thinking = true, preserve_thinking = true, reasoning_effort = "xhigh" }
tokenize_crosscheck = "native"

[serving_resources]
# #378 (2026-11-14): sized from the job cgroup (task_synthesis/serve/reslog.py), RAM ~1.25x the non-reclaimable peak (rss + shmem + dirty; page cache is reclaimed, never held), CPUs = RAM/16 (free under max(CPUs, GB/16)); /data/aai/aa_evals/audits/server_shapes_20261114/report.md
cpus_per_gpu = 15
memory_gib_per_gpu = 240   # 160 GiB pinned CPU KV tier + engine: peak 168 GiB (1xB200 replay), 193 GiB with images (aa-qwen-qa2, condor RSS); was 16 / 320
disk_gib = 120
bid_per_job = { 1 = 61, 4 = 63 }
exclude_nodes = ["cpu207", "gpu132", "cpu404"]

[worker_resources]
slots = 11
cpus = 20
memory_gib = 320
disk_gib = 1024
bid = 56
exclude_nodes = ["gpu132", "cpu101"]

[admission]
initial_limit_per_backend = 40
maximum_limit_per_backend = 48
emergency_kv_high = 0.72
resume_kv = 0.55
