# AA evals judge study s3 (#41): google/gemma-4-31B-it (dense) at FP8, one replica per 1xH100.
# Checkpoint: RedHatAI/gemma-4-31B-it-FP8-dynamic (llm-compressor: FP8 per-channel weights, dynamic per-token
# activations; ~33 GB), vLLM's compressed-tensors path. Google ships no FP8 build of 31B; RedHat's is the
# vLLM-maintained one. bf16 KV cache.
# Text-only judge: images and video are off (no encoder memory); 131k context (judge prompts are a few k tokens).
# Sampling is Google's model-card setting (T 1.0, top_p 0.95, top_k 64; generation_config.json also stops on 1/106/50).
# Thinking: Gemma 4 has one switch (`<|think|>` in the system turn via enable_thinking), no effort levels. The
# registry default is thinking ON, the closest setting to AA's "medium" judge; the judge arm spells it out.
# Structured outputs: compact JSON only (xgrammar disable_any_whitespace). HLE's official judge schema requires a
# trailing `strict: true` field its prompt never mentions; with free whitespace allowed, Gemma closes `confidence`
# and then pads newlines to max_tokens (32k) instead of writing `,"strict":true`, on every probe. Compact JSON leaves
# `,` as the only legal continuation. GDP.pdf's schema was unaffected; no effect on the JSON's content.
# MTP: google/gemma-4-31B-it-assistant (KV-shared draft), off unless --tunables '{"mtp": N}'.
slug = "gemma4-31b-it-fp8"
model = "google/gemma-4-31B-it"
revision = "d4ab4f579dd3516f97d8a6a4c98d0653480bad15"   # RedHatAI/gemma-4-31B-it-FP8-dynamic
checkpoint = "/data/aai/models/gemma-4-31B-it-FP8-dynamic"
served_name = "gemma-4-31b-it"
stage_checkpoint = true

[runtime]
venv = "/opt/aai/venvs/vllm032"
vllm_version = "0.32.0rc1.dev190+g3f1bcfd82"
cuda_home = "cu13-wheel"
nvcc_append_flags = "-DCCCL_DISABLE_CTK_COMPATIBILITY_CHECK"
cache_env = ["VLLM_CACHE_ROOT", "TORCHINDUCTOR_CACHE_DIR", "TRITON_CACHE_DIR", "FLASHINFER_WORKSPACE_BASE", "XDG_CACHE_HOME"]
env = { HF_HUB_OFFLINE = "1", HF_HUB_DISABLE_XET = "1" }

[serving]
mode = "replicas"
gpus_per_replica = 1
entrypoint = ["{venv}/bin/vllm", "serve"]
args = [
  "{model_dir}", "--served-model-name", "{served_name}", "--host", "0.0.0.0", "--port", "{port}",
  "--max-model-len", "{max_model_len}", "--tensor-parallel-size", "1", "--gpu-memory-utilization", "0.92",
  "--max-num-seqs", "{max_seqs}", "--max-num-batched-tokens", "{max_batched}",
  "--enable-prefix-caching", "--enable-chunked-prefill", "--enable-auto-tool-choice",
  "--tool-call-parser", "gemma4", "--reasoning-parser", "gemma4", "--generation-config", "vllm", "--seed", "{seed}",
  "--override-generation-config", '{{"temperature":1.0,"top_p":0.95,"top_k":64,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0,"max_tokens":{max_output_tokens},"stop_token_ids":[1,106,50]}}',
  "--default-chat-template-kwargs", '{{"enable_thinking":true}}',
  "--limit-mm-per-prompt", '{{"image":0,"video":0}}',
  "--no-enable-log-requests", "--enable-prompt-tokens-details",
  "--structured-outputs-config", '{{"backend":"xgrammar","disable_any_whitespace":true}}',
]
seed = 0
startup_timeout_sec = 3600

[serving.tunables]
max_seqs = 128
max_batched = 16384
omp_threads = 8

[serving.optional_args]
mtp = ["--speculative-config", '{{"method":"mtp","model":"/data/aai/models/gemma-4-31B-it-assistant","num_speculative_tokens":{mtp}}}']

[request]
client_model = "hosted_vllm/gemma-4-31b-it"
overrides = { temperature = 1.0, top_p = 0.95, top_k = 64, min_p = 0.0, presence_penalty = 0.0, repetition_penalty = 1.0, chat_template_kwargs = { enable_thinking = true } }

[counting]
serializer = "jinja"
tokenizer = "{checkpoint}/tokenizer.json"
chat_template = "{checkpoint}/chat_template.jinja"
render_kwargs = { add_generation_prompt = false, enable_thinking = true }
tokenize_crosscheck = "native"

[serving_resources]
cpus_per_gpu = 16
memory_gib_per_gpu = 128
cuda_capability = "9.0"   # H100
disk_gib = 120
bid_per_job = { 1 = 51 }   # H100; single-GPU jobs may bid 101 when 51 starves (user, #111)
exclude_nodes = ["cpu203", "cpu205", "cpu207", "cpu208", "gpu110", "gpu132"]

[worker_resources]
slots = 11
cpus = 20
memory_gib = 320
disk_gib = 1024
bid = 56
exclude_nodes = ["gpu132", "cpu101"]

[admission]
initial_limit_per_backend = 40
maximum_limit_per_backend = 48
emergency_kv_high = 0.72
resume_kv = 0.55
