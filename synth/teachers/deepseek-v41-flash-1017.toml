# DeepSeek-V4.1-Flash-1017 (2026-10-17 refresh of V4.1-Flash: same architecture, config, encoder and
# tokenizer; new weights). Only DeepSeek's native release exists (FP8 MXFP8-layout linears, MXFP4
# routed experts, FP8 Engram), so this serves the native weights where deepseek-v41-flash served
# NVIDIA's NVFP4 PTQ; vLLM (0.32, and main since 2026-11-18) loads them through DeepseekV4FP8Config + Mxfp4MoEMethod.
# Serving (tuning campaign 20261017-deepseek-v41-flash-1017-tuning, synth.bench replay of 600 recorded V4.1 Pi
# trajectories on 4xB200): DP4/EP4 behind one API server, Engram tables shared once in host memory, DSpark-5:
# 9.8k / 15.1k / 17.3k generated tok/s at 128 / 256 / 384 agents (KV <= 11%, no preemptions), vs 9.5k for the
# deepseek-v41-flash TP4 configuration at 128 agents and 14.2k for TP4 with 256 seqs at 384. TP4 once hung
# (sample_tokens RPC timeout after 5 min) near 95 running requests; the step timeout is 20 min here.
# 2026-10-24: vLLM's B200 AgentX DEP profile (vllm#62541: DeepGEMM MegaMoE, FlashInfer autotune, Engram embedding
# across DP, 0.97 memory, CUDA graphs to 8190 tokens, V2 model runner), max-num-seqs 768 per rank. Paired replay
# of 2,818 recorded V4.1 trajectories on one 8xB200 node (cpu401, 2026-10-23, branch deepseek-throughput,
# inference/deepinfer/README.md): 40.6k / 41.4k / 38.3k generated tok/s per 4-GPU backend at 2,000 / 3,000 / 4,000
# agents, vs 23.2k / 23.3k / 22.9k for the previous command (max-num-seqs 256) side by side (+75-78%); the previous
# command sat at its request cap with KV ~30%. max-num-seqs sweep on one node (cpu305, 2026-10-24, same replay, NVLS
# off): 512 / 768 / 1024 per rank gave 41.9k / 43.7k / 41.8k at 3,000 agents; 768 gave 41.7k at 4,000; 1024 gave
# 37.9k at 4,000 and collapsed to 12.0k at 5,000 (prefix hit 0.28: KV thrash; 1024 leaves 15.1M KV tokens per rank
# vs 17.1M at 512). This file is pinned to the command the 768 arm recorded (synth/tests/fixtures/
# recorded-commands.json). (10-23: nightly f3871c3cb was 6-9% slower than 0.32; superseded on 11-18, below.)
# NCCL_NVLS_ENABLE=0: NVSwitch multicast made no difference for this command (cpu401 NVLS off 40.6k/41.4k vs cpu302 NVLS on
# 39.1k/39.7k at 2,000/3,000 agents), and with it off the engine also starts on nodes whose NVLS is broken (cpu308, cpu401).
# 2026-11-18 (#478, #9): vLLM main 8f3c672dc (0.34.0rc1.dev815 nightly, cu132; torch 2.14.0, FlashInfer 0.7.4 with its
# official flashinfer-cubin wheel, NCCL 2.30.7 cu13) replaces vllm032 with the same command. Same 4 B200s (cpu303),
# closed-loop replay of the 2,718 recorded V4.1 trajectories, 4 clients: 43.3k vs 41.2k gen tok/s at 3,000 agents
# (+5.1%), 47.5k vs 43.0k at 4,000 (+10.6%); DSpark mean accepted length 2.90 vs 2.46; KV 17.93M vs 15.80M tokens per
# rank. It fixes vllm#61114 (#9: DSpark block verification biased sampling; reproducer z -73.9 -> +0.6), keeps the
# last prefix-cache block for DSpark (vllm#54163), and greedy / first-token logprobs on 48 real prompts stay within
# each build's own prefix-hit-vs-fresh floor. Record: #478; tooling: branch rt-vllm-ds, inference/vllm_upgrade/.
# Built from the nightly wheel as a relocatable venv on /data (not /home: quota). The [counting] encoder stays
# vllm032's: main's renders requests identically (300 of 300 recorded), but appends "<｜Assistant｜><think>" after a
# conversation that ends in an assistant message, which would change exported SFT segments (synth/export.py).
# 2026-11-19: task synthesis follows (its profile dropped the vllm032 pin and DSpark-3): one-shot replay on main, 2,000
# running, vllm032 DSpark-3 73.4k / 71.3k, main DSpark-3 77.5k / 79.3k, main DSpark-5 78.9k / 78.8k gen tok/s.
slug = "deepseek-v41-flash-1017"
model = "deepseek-ai/DeepSeek-V4.1-Flash-1017"
revision = "1bae0e1088993b9b82de08f59de5be5a34e42170"
checkpoint = "/data/aai/tbench/synth/shared/checkpoints/deepseek-v41-flash-1017/1bae0e1088993b9b82de08f59de5be5a34e42170"   # synth.fetch
served_name = "deepseek-v41-flash-1017"
stage_checkpoint = true

[runtime]
venv = "/data/aai/venvs/vllm-0.34.0rc1.dev815-g8f3c672dc-cu132"   # was venvs/vllm032 (0.32.0rc1.dev190) until 2026-11-18
vllm_version = "0.34.0rc1.dev815+g8f3c672dc"
cuda_home = "cu13-wheel"
cu13_ld_library_path = true
nvcc_append_flags = "-DCCCL_DISABLE_CTK_COMPATIBILITY_CHECK"
cache_env = ["HUMMING_CACHE_DIR", "HUMMING_TMP_DIR", "VLLM_CACHE_ROOT", "TORCHINDUCTOR_CACHE_DIR",
             "TRITON_CACHE_DIR", "FLASHINFER_WORKSPACE_BASE", "XDG_CACHE_HOME", "HF_HOME"]
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1", MKL_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", VLLM_ENGINE_READY_TIMEOUT_S = "7200", VLLM_USE_RUST_FRONTEND = "0", VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS = "1200", VLLM_USE_V2_MODEL_RUNNER = "1", NCCL_NVLS_ENABLE = "0", FLASHINFER_NO_DOWNLOAD = "1" }
# FLASHINFER_NO_DOWNLOAD (2026-11-19): the venv's flashinfer-cubin wheel holds every .cubin / .h FlashInfer 0.7.4 lists
# (47,333; the 1,456 missing x86_64 cute-DSL attention .so files are never loaded for DeepSeek's sparse MLA). A missing
# one fails loudly on first use (a CUDA module error on the C++ path) instead of being downloaded into the shared /data
# venv under a filelock on Lustre. Not numerics, not compiled code: skipped by both numerics records and the
# engine-cache key.

[serving]
mode = "dp_internal"
gpus_per_replica = 1
entrypoint = ["{venv}/bin/python", "-m", "vllm.entrypoints.cli.main", "serve"]
args = [
  "{model_dir}", "--served-model-name", "{served_name}", "--host", "0.0.0.0", "--port", "{port}",
  "--tensor-parallel-size", "1", "--data-parallel-size", "{dp_size}", "--enable-expert-parallel",
  "--tokenizer-mode", "deepseek_v41", "--reasoning-parser", "deepseek_v41", "--tool-call-parser", "deepseek_v41",
  "--enable-auto-tool-choice", "--language-model-only", "--max-model-len", "{max_model_len}",
  "--max-num-seqs", "{max_seqs}", "--max-num-batched-tokens", "{max_batched}", "--gpu-memory-utilization", "0.97",
  "--enable-chunked-prefill", "--kv-cache-dtype", "fp8",
  "--engram-config", '{{"cpu_offload": true, "embedding_across_dp": true}}',
  "--attention-config", '{{"backend": "FLASHINFER_MLA_SPARSE_DSV41", "indexer_kv_dtype": "mxfp4", "indexer_sparse_logits": true}}',
  "--generation-config", "vllm",
  "--override-generation-config", '{{"temperature":1.0,"top_p":0.95,"max_new_tokens":{max_output_tokens}}}',
  "--default-chat-template-kwargs", '{{"thinking":true,"reasoning_effort":"max"}}',
  "--seed", "{seed}", "--no-enable-log-requests",
  "--model-loader-extra-config", '{{"enable_multithread_load":true,"num_threads":16}}', "--enable-prefix-caching",
  "--kernel-config", '{{"enable_flashinfer_autotune": true, "moe_backend": "deep_gemm_mega_moe"}}',
  # DSpark-5 verify steps are 6 tokens per request: graphs to 8190 tokens cover 1,365 requests per rank.
  "--compilation-config", '{{"mode": "VLLM_COMPILE", "cudagraph_mode": "FULL_AND_PIECEWISE", "cudagraph_capture_sizes": [6, 12, 18, 24, 30, 36, 48, 60, 72, 96, 120, 144, 192, 240, 288, 384, 480, 576, 768, 1020, 1536, 2046, 3072, 4092, 6144, 8190], "decoder_replay_cudagraph_capture_sizes": [6, 12, 18, 24, 30, 36, 48, 60, 72, 96, 120, 144, 192, 240, 288, 384, 480, 576, 768, 1020, 1536, 2048, 2304, 2560, 2816, 3072, 3328, 3584, 3840, 4096]}}',
]
seed = 341015
startup_timeout_sec = 7200

[serving.tunables]
spec_tokens = 5
max_seqs = 768        # per DP rank (cpu305 sweep: best of 512 / 768 / 1024; 256 pinned replays at the cap)
max_batched = 8192
omp_threads = 1
moe_backend = ""   # leave empty: --kernel-config selects DeepGEMM MegaMoE (the tuning campaign set "deep_gemm" here)

[serving.optional_args]
spec_tokens = ["--speculative-config", '{{"method": "dspark", "num_speculative_tokens": {spec_tokens}, "draft_sample_method": "probabilistic", "rejection_sample_method": "block", "enable_adaptive_verification": true}}']
moe_backend = ["--moe-backend", "{moe_backend}"]
# Per-request cached_tokens in the usage (kv_fit's per-agent reuse, the slope search's thrash signal); campaigns set
# teacher_overrides.serving.tunables.prompt_tokens_details = 1. Without it the 10-24 live run had no reuse signal.
prompt_tokens_details = ["--enable-prompt-tokens-details"]
# CPU KV tier for idle agents' contexts (off unless a campaign or control file sets kv_offloading_size, GiB of pinned host
# RAM per DP rank, plus extra_env VLLM_USE_SIMPLE_KV_OFFLOAD=1 as on nemotron35-super). Live agents spend ~65% of their
# time outside model calls (10-24 live run: ~600-900 of ~3,000 agents in flight), so idle contexts, not the engine, cap
# admission. Untested with DeepSeek's sparse MLA + Engram + DSpark on this build: replay it before a campaign uses it.
# Host RAM: 4 ranks x size + ~130-190 GiB of pinned Engram + the staged checkpoint's page cache.
kv_offloading_size = ["--kv-offloading-size", "{kv_offloading_size}", "--kv-offloading-backend", "native",
                      "--kv-transfer-config", '{{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{{"lazy_offload":false}}}}']

[request]
client_model = "openai/deepseek-v41-flash-1017"
pi_thinking = "max"
# Pi's top-level reasoning_effort overrides template kwargs in vLLM; pin both.
overrides = { temperature = 1.0, top_p = 0.95, reasoning_effort = "max", chat_template_kwargs = { thinking = true, reasoning_effort = "max", drop_thinking = false } }
# vLLM's /tokenize crashes on DeepSeek V4.1 tool histories; the guard renders with the vendored encoder.
# PI_CONTEXT_TOKENIZER: the guard counts the rendered prompt in-process instead of a /tokenize round trip through the
# API servers (10-24 live run: 3.5 s and 13% of every request; local counts matched /tokenize on 426 of 426 requests).
env = { PI_CONTEXT_RENDERER = "deepseek_v41", PI_CONTEXT_TOKENIZER = "/data/aai/tbench/synth/shared/checkpoints/deepseek-v41-flash-1017/1bae0e1088993b9b82de08f59de5be5a34e42170/tokenizer.json" }

[counting]
serializer = "deepseek"
encoder = "/opt/aai/venvs/vllm032/lib/python3.12/site-packages/vllm/tokenizers/deepseek_v41_encoding.py"   # see the header (2026-11-18)
tokenizer = "{checkpoint}/tokenizer.json"
encode_kwargs = { thinking_mode = "thinking", drop_thinking = false, reasoning_effort = "max" }

[serving_resources]
# #378 (2026-11-14): sized from the job cgroup (task_synthesis/serve/reslog.py), RAM ~1.25x the non-reclaimable peak (rss + shmem + dirty; page cache is reclaimed, never held), CPUs = RAM/16 (free under max(CPUs, GB/16)); /data/aai/aa_evals/audits/server_shapes_20261114/report.md
# Host RAM: Engram tables 191 GiB in shared memory + ~28 GiB of processes (#281 replay, cgroup per minute) + the
# 4 x 64 GiB pinned CPU KV tier the eval profile turns on (c30 RSS 291 GB = tier + processes) = ~475 GiB; without the
# tier (task generation) ~219 GiB. Measured at 600 GiB (v14-ds, 512 agents): 476.5 GiB (rss 283.5 + shm 193); past long
# runs' condor RSS reached 292-310 GiB (+193 shm = 485-503), so 640 GiB (1.27-1.34x). Cores: 3.3-4.5 on average, 6.4
# at peak (#281); v14 p99 7.5. Was 8 / 768 (1536 via the serve_teacher profile).
cpus_per_gpu = 10
memory_gib = 640
disk_gib = 1200
bid_per_job = { 4 = 63 }
exclude_nodes = ["cpu207", "cpu307", "cpu403", "cpu405", "gpu132"]   # cpu404 served …-calibforge-slots48 at full throughput (10-25); cpu403: cuInit fails (GPU preflight); cpu405: a stuck foreign process holds 43 GB of GPU 4 (2026-10-24), vLLM 0.97 fails there

[worker_resources]
# 2026-10-24 (issue #7): 32 agent slots per 16-CPU job (was 8). Post-fix workers used 0.23-0.40 cores and ~0.25 GiB
# per busy slot (p99 per 24-slot worker 9.3 cores; no tool slowdown up to 1 slot per CPU), so 32 slots peak near
# 12 cores of 16. At 8 slots, ~3,300 slots per backend took ~6,600 CPUs (89% of what bid-36 jobs could get on
# 2026-10-24); at 32 it is ~104 jobs / 1,664 CPUs. Analysis: synth/analysis/worker_footprint.py, worker_capacity.py.
# Watch the first hour (resources.jsonl: loadavg, failcnt, oom_kill); drop to 24 slots if tools slow down.
# 2026-10-25: 48 slots (live CalibForge, 20261025-…-calibforge-slots48 vs …-offload2 at 32; same 4xB200 recipe):
# workers ran 37-42 agents (p50-p90), CPU busy p50 3.1 / p90 15.9 cores in both (>=15 cores 22% vs 23% of the
# time), 0.17 vs 0.21 cores and 0.30 vs 0.31 GiB RSS per agent, tool latency no worse (python p90 3.9 vs 10.5 s),
# no holds or OOM kills, gen tok/s at steady context the same (43-44k), with ~30% fewer worker jobs.
# Record: docs/campaigns/synth-20261025-deepseek.md.
slots = 48
cpus = 16
memory_gib = 192      # 128 GiB workers were held (cgroup page cache from 32 sandboxes' /data writes, 10-25); Super runs 192 without holds
disk_gib = 320
bid = 56                  # user 2026-10-25: at 36 ~120 worker jobs sat queued and capped live agents
exclude_nodes = ["gpu132", "gpu110", "cpu105", "cpu301", "cpu208", "gpu158"]   # gpu132/g110: unreachable /data OST; cpu105/i301: crawling /data I/O (10-23); cpu208: workers stall (10-26); gpu158: /data I/O hung a pack job (10-25)

[admission]               # one dp_internal backend per job: the limit covers all four ranks
# 2026-10-24 (issue #6): kv_fit with slope search and DeepSeek priors. Admission-driven replays (cpu308, 4 coordinated
# clients, branch deepseek-throughput, inference/deepinfer/README.md "Adaptive admission on DeepSeek"): this policy
# first reached >= 38k gen tok/s at 6.3 min and averaged 43.8k at ~2,750 agents after minute 20 with max-num-seqs 768
# (40.5k at 512), holding at the engine cap (`engine_cap`), reuse ~0.95, no preemptions. Defaults ramp too slowly
# here (prior 20k, target 0.4, 32 per tick: 36 min to the knee) and the default throughput search drifts down (~32k).
# kv_fit budgets KV working set rather than attempts, so attempts in setup or verification (11-20% of attempt time)
# no longer count against the knee. Campaigns need workers.max_count (~70-95 workers per backend at 48 slots).
# The limit-mode keys below apply only to campaigns that set mode = "limit".
mode = "kv_fit"
target_search = "slope"
agent_tokens_prior = 15000                 # measured working set per agent 12-16k at 1,365-2,000 agents
kv_target_fraction = 0.6                   # start near the knee (~2,700 agents on a 4xB200 backend on vllm032; main has 13.5% more KV)
new_agents_per_backend_per_period = 300    # per tick: short TMax attempts (~5-9 min) finish ~190/min at 2,300 agents and slow ticks
                                           # (20-60 s) made 96 the cap; 300 took live TMax from 2,285 to 3,377 agents (10-25)
# Limit mode only (kv_fit drops these keys, synth/config.py): 4,000 agents per backend since 2026-11-18 (#478, vLLM
# main): closed-loop replay on main gave 47.5k gen tok/s at 4,000 agents with 9 requests queued and KV peak 41%
# (vllm032: 43.0k with 1,139 queued, KV 51%), so main's knee is above 4,000; nothing past 4,000 was measured
# (vllm032 at max-num-seqs 1024 thrashed at 5,000, prefix hit 0.28). Was 3,000 on vllm032 (best open-loop point
# 43.7k at 3,000, KV 50%, ~440 queued; 4,000 lost 5%). Under kv_fit the KV target and the engine cap set the agents.
# Workers must provide the slots: ~4,000 agents per backend plus eval (campaign workers.count x slots).
initial_limit_per_backend = 2500
maximum_limit_per_backend = 4000
limit_step = 64
burst = 64                # 2,500 agents in ~10 min (8 per 15 s took ~45 min to fill 384 on 10-18)
max_waiting = 128         # kv_fit (validated): a short queue per rank, engine_cap holds admission there. Limit mode used 512
                          # (the queue at its best point was ~440 of prefill backlog, not overload)
increase_below_kv = 0.55  # in-flight KV: 50% at 3,000 agents, 54% at 4,000 (vllm032, open loop); main closed loop 39% / 41%
