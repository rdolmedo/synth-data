# AA evals: SFT checkpoints of the Snowball architecture (GrugMoe 67B-A2B; HF exports of sft_snowball/hf_io.py) under
# test, one replica per B200, 128k context (M3.0), text only. One spec for every checkpoint of the architecture:
#   serve_teacher submit --teacher snowball-eval --checkpoint DIR --name NAME     (1x B200 at bid 61 by default)
# (`checkpoint` below is the default, the smoke-test SFT). Submit refuses a checkpoint that is not a GrugMoe export with
# the Snowball TB chat template ([checkpoint_checks]).
#
# Port, without re-tuning, of eval_q35's Snowball TB serving (branch eval-snowflake-tb 0bacc3c: eval_q35/common.py
# SNOWBALL_*, submit.py snowball_config, serve_job.sh profile snowball; serve_snowball/):
# - vLLM 0.20.1 (/home/user/vllm0201) with the out-of-tree GrugMoe plugin (serve_snowball/plugin/grug_vllm, on
#   PYTHONPATH): vLLM's in-tree grug_moe loader bypasses FusedMoE.weight_loader and skips the FP8 experts. hf_overrides
#   names the plugin's own architecture (GrugMoeServeForCausalLM), so a server that did not load the plugin cannot start
#   instead of falling back to the in-tree model. The plugin compiles the model (GRUG_COMPILE, default on) and refuses
#   vLLM / FlashInfer versions other than 0.20.1 / 0.6.8.post1.
# - block-FP8 weights quantized at load (128x128, power-of-two scales GRUG_FP8_POW2 on CUTLASS: VLLM_USE_DEEP_GEMM=0, no
#   DeepGEMM JIT at start), FP8 KV cache.
# - GRUG_SWA_KEEP: vLLM frees sliding-window blocks behind the window, so without it the next agent turn misses the
#   prefix cache (19 of 26 layers are SWA). GRUG_SEEDED_SAMPLER: batched sampling of seeded requests (Pi sends a seed per
#   request). GRUG_TRITON_ROUTING: fused MoE routing (maps NaN padding rows to valid ids).
# - GRUG_FI_AOT_DIR: prebuilt FlashInfer modules for the GPU arch (fi_aot_arch: 100a = B200, 90a = H100): no ~600 s nvcc
#   build of the TRTLLM block-FP8 MoE launcher per job and no shared JIT cache (concurrent jobs race on it).
#   CUDA_HOME = CUDA 13.2 (vLLM 0.20.1 needs one).
# - text-level reasoning / tool parsers (serve_snowball/snowball_parsers.py): Snowball uses the Llama-3 tokenizer, so
#   <think>, </think>, <tool_call> and <function=...> are ordinary text; qwen3 / qwen3_coder refuse to start on it.
# - 16,384 batched tokens, 256 sequences, GPU utilization 0.90, 4 API server processes (a TB-SFT'd Snowball takes many
#   short turns, each a full history render in the API process), seed 0, vLLM generation config with T 1.0 / top_p 0.95.
# - request: T 1.0 / top_p 0.95, reasoning_effort high (vLLM 0.20.1 accepts none/low/medium/high only: Pi's proxy default
#   max and AA's xhigh are 400s; the Snowball template ignores the field), clear_thinking false: exactly what eval_q35's
#   proxy sets on every Snowball request. Pi itself keeps its protocol's thinking level, as in eval_q35.
# - admission: eval_q35's context-aware turn gate (turn_gate.py) with the proxies' KV brake 0.80/0.72, hosted by the
#   pi_eval run (request.ctx_gate), as eval_q35 runs Snowball by default (common.default_ctx_gate). No aa_evals gate in
#   front (serve_teacher PROFILE). Concurrency for a whole model run: the dispatcher budget, ~128 per B200. Measured
#   on this spec (2026-11-13, replay of eval_q35's TB2.1 Snowball traffic, 7.96M cache tokens): 4,229 gen tok/s at 128
#   agents, 4,283 at 160 (prefix hits 0.89), thrashing at 192; AA Pi agents run on to the 128k window (~2.5x a TB
#   rollout), so a Pi-heavy mix fits fewer (m5/validation notes/serving.md).
# Differences from eval_q35 (named, not tuned): 131,072-token context (M3.0; eval_q35 132,000); --language-model-only
# (launch evidence that the endpoint is text-only, which aa_evals' --model-images off checks; GrugMoe has no vision
# tower, so the engine is unchanged); the chat template from the checkpoint directory, checked by hash at submit
# (eval_q35 pins sft_snowball/snowball_chat_template.jinja by the same hash, common.GRUG_TEMPLATES); multi-GPU jobs run
# one engine per GPU (serve_teacher replicas) instead of eval_q35's DP2 + expert-parallel engine on 2 GPUs.
slug = "snowball-eval"
model = "GrugMoe 67B-A2B (Snowball architecture), TB SFT exports of sft_snowball/hf_io.py"
revision = "per checkpoint: serve_teacher --checkpoint (recorded in job.json, launch.json and endpoints.json)"
checkpoint = "/data/aai/tbenchtrain/snowball_sft/ckpts/ib-sb18k-1p0b-lr5p8e-4"
served_name = "snowball"
stage_checkpoint = true

[checkpoint_checks]
architectures = ["GrugMoeForCausalLM"]
# sft_snowball/snowball_chat_template.jinja (eval_q35 common.GRUG_TEMPLATES['snowball']): <think> and XML tool calls,
# which snowball_parsers.py reads
chat_template_sha256 = ["cb728ba63d3c6393bbce328a7c6a00359f259b7b9b1bbdc074b1ad53e5029f7c"]

[runtime]
venv = "/home/user/vllm0201"
vllm_version = "0.20.1"
cuda_home = "/is/software/nvidia/cuda-13.2"
cuda_visible_devices = "index"   # vLLM 0.20.1 parses CUDA_VISIBLE_DEVICES as integers (HTCondor assigns UUIDs)
cache_env = ["HOME", "VLLM_CACHE_ROOT", "TORCHINDUCTOR_CACHE_DIR", "TRITON_CACHE_DIR", "FLASHINFER_WORKSPACE_BASE",
             "XDG_CACHE_HOME"]
env = { PATH = "/is/software/nvidia/cuda-13.2/bin:/home/user/vllm0201/bin:/usr/local/bin:/usr/bin:/bin", PYTHONPATH = "{repo}/serve_snowball/plugin", HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1", VLLM_WORKER_MULTIPROC_METHOD = "spawn", VLLM_ENGINE_READY_TIMEOUT_S = "3600", GRUG_SWA_KEEP = "1", GRUG_SEEDED_SAMPLER = "1", GRUG_TRITON_ROUTING = "1", GRUG_FP8_POW2 = "1", VLLM_USE_DEEP_GEMM = "0" }

[serving]
mode = "replicas"
gpus_per_replica = 1
entrypoint = ["{venv}/bin/vllm", "serve"]
args = [
  "{model_dir}", "--served-model-name", "{served_name}", "--host", "0.0.0.0", "--port", "{port}",
  "--max-model-len", "{max_model_len}", "--tensor-parallel-size", "1", "--gpu-memory-utilization", "{gpu_util}",
  "--max-num-seqs", "{max_seqs}", "--max-num-batched-tokens", "{max_batched}", "--api-server-count", "{api_servers}",
  "--enable-prefix-caching", "--kv-cache-dtype", "fp8", "--quantization", "fp8",
  "--hf-overrides", '{{"quantization_config":{{"quant_method":"fp8","activation_scheme":"dynamic","weight_block_size":[128,128]}},"architectures":["GrugMoeServeForCausalLM"]}}',
  "--reasoning-parser-plugin", "{repo}/serve_snowball/snowball_parsers.py",
  "--tool-parser-plugin", "{repo}/serve_snowball/snowball_parsers.py",
  "--reasoning-parser", "snowball", "--enable-auto-tool-choice", "--tool-call-parser", "snowball",
  "--generation-config", "vllm", "--override-generation-config", '{{"temperature":1.0,"top_p":0.95}}',
  "--chat-template", "{model_dir}/chat_template.jinja",
  "--language-model-only", "--enable-prompt-tokens-details",
  "--no-enable-log-requests", "--seed", "{seed}",
]
seed = 0
startup_timeout_sec = 3600
# Startup probes (synth.probe: greedy "17 + 25" and a bare-bash tool call) are logged to <registry>/probe.jsonl, not
# fatal: a student that answers the bare prompt in plain text (m5v-W-1b, 2026-11-13) is a model outcome; parsing was
# validated in the smoke (notes/serving.md).
probe = "log"

[serving.env]
GRUG_FI_AOT_DIR = "/data/aai/tbenchtrain/snowball_serve/fi_aot/{fi_aot_arch}"

[serving.tunables]
gpu_util = 0.90          # eval_q35 submit.py default
max_seqs = 256           # eval_q35 default
max_batched = 16384      # eval_q35 serve_job.sh
api_servers = 4          # eval_q35 snowball_config
fi_aot_arch = "100a"     # B200; "90a" with --cuda-cap 9.0
omp_threads = 4          # = the cores per engine (cpus_per_gpu, and cpus_per_extra_engine for each extra engine: keep them
                         # equal) since the #531 trim: 8 per engine on 4 cores per GPU gave the first trimmed server 21-28 s
                         # of run-queue wait per 10 s during init. OMP_NUM_THREADS is not numerics. Was 8

[request]
client_model = "hosted_vllm/snowball"
# pi_eval: run eval_q35's context-aware turn gate with the run, plus the proxies' KV brake 0.80/0.72
ctx_gate = true
ctx_fill = 0.7
kv_gate = "0.80,0.72"
overrides = { temperature = 1.0, top_p = 0.95, reasoning_effort = "high", chat_template_kwargs = { clear_thinking = false } }

[counting]
# synth-campaign token accounting only (synth/serializers.py, synth/prepare.py); serve_teacher never reads it, so the
# engine argv, env and engine-cache key are unchanged. The checkpoint's own Llama-3 tokenizer and Snowball template.
serializer = "jinja"
tokenizer = "{checkpoint}/tokenizer.json"
chat_template = "{checkpoint}/chat_template.jinja"
render_kwargs = { add_generation_prompt = false }

[serving_resources]
# #378 method (2026-11-14, optim-port-snowshape-1, 1x B200 at 8c/96G, replay of eval_q35's TB2.1 Snowball traffic at
# 128 agents, the dispatcher budget: 4,366 gen tok/s, prefix hit 0.94, no holds): cgroup non-reclaimable peak 8.8 GiB
# (rss 8.6 + shmem 0.2; page cache is reclaimed, never held; M5's long AA runs: condor RSS <= 10.6 GB per engine),
# serving cores p99 2.51 (load window 2.35), start-up max 3.9. CPUs bind: 3x p99 -> 8. RAM is free up to 16 x CPUs
# (units = max(CPUs, GB/16)), so 128 GiB at the same 8 units as 96 (no saving: CPUs were already at need). More page
# cache for the 125 GiB staged checkpoint, though it still does not fit whole with the 8.8 GiB peak (benefit unmeasured).
# /data/aai/aa_evals/audits/snowball_port_20261114/live/shape_summary.json. Was 8 / 96 (#258 eval_q35 numbers).
# 2026-11-18 (#531, rt-lean, coordinator-approved trim): the 11-15..18 evals' 2-GPU servers (one engine per GPU) used
# mean 2.2-2.9 cores, p95 3.4-4.2, max 9-10 only at start-up, and 17-20 GB of hard memory (36 GB on 4 GPUs), against
# 16c/256G: 4c / 64G per GPU (8c/128G per 2-GPU server, -8 units/h per server, -12.5%; ~30k credits at the floor over
# that window). Start-up may briefly want more cores than that (it is slower, not refused); the memory net (+25% per
# hold) covers RAM. Several engines per GPU (tunables engines_per_gpu k > 1) keep 4 more cores per extra engine
# (cpus_per_extra_engine): k = 2 is today's 8 per GPU. Was 8 / 128.
cpus_per_gpu = 4
memory_gib_per_gpu = 64    # hard 17-20 GB per 2-GPU server, 36 GB per 4; mean cores 2.2-2.9, p95 3.4-4.2; was 128
cpus_per_extra_engine = 4  # per GPU, for each engine beyond the first (engines_per_gpu k: cpus_per_gpu + 4 (k - 1))
cuda_capability = "10.0"   # B200
default_gpus = 1           # one replica (submit --gpus N: N independent engines, one per GPU)
default_bid = 61
disk_gib = 400             # 134 GB bf16 checkpoint staged on local disk, plus engine caches
bypass_lxcfs = true
exclude_nodes = ["cpu102", "cpu307", "cpu403", "cpu405"]   # eval_q35 submit.py's Snowball exclusions
